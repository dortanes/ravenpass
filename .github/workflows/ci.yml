name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      homebrew: ${{ steps.filter.outputs.homebrew }}
      core: ${{ steps.filter.outputs.core }}
      licenses: ${{ steps.filter.outputs.licenses }}
      interface: ${{ steps.filter.outputs.interface }}
      extension: ${{ steps.filter.outputs.extension }}
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
              - Makefile
            node: &node
              - package.json
              - package-lock.json
              - .nvmrc
              - tsconfig.base.json
              - biome.json
            ui: &ui
              - packages/ui/**
              - packages/app/messages/**
            homebrew:
              - *ci
              - Casks/**
            core:
              - *ci
              - go.work*
              - "**/*.go"
              - "**/go.mod"
              - "**/go.sum"
            licenses:
              - *ci
              - notices/**
              - package-lock.json
              - "**/package.json"
              - go.work*
              - "**/go.mod"
              - "**/go.sum"
              - apps/mobile/build/android/**/*.gradle.kts
              - apps/mobile/build/android/gradle/**
            interface:
              - *ci
              - *node
              - *ui
            extension:
              - *ci
              - *node
              - *ui
              - apps/extension/**
            desktop:
              - *ci
              - *node
              - go.work*
              - packages/**
              - apps/desktop/**
            android:
              - *ci
              - *node
              - go.work*
              - packages/**
              - apps/mobile/**

  homebrew:
    name: Homebrew cask
    needs: changes
    if: needs.changes.outputs.homebrew == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew style Casks/ravenpass.rb
      - name: Audit cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap --custom-remote dortanes/ravenpass "$GITHUB_WORKSPACE"
          brew trust --cask dortanes/ravenpass/ravenpass
          brew audit --cask --online dortanes/ravenpass/ravenpass

  core:
    name: Go core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - run: make check-core

  licenses:
    name: Dependency licenses
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: make licenses-check

  interface:
    name: Interface
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make check-ui
      - name: Generated catalogs are current
        run: |
          make messages
          if [ -n "$(git status --porcelain --untracked-files=all -- packages/app/messages)" ]; then
            git status --short --untracked-files=all -- packages/app/messages
            git diff -- packages/app/messages
            echo "::error::Generated catalogs are stale; run make messages and commit the result"
            exit 1
          fi

  extension:
    name: Chrome extension
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make -C apps/extension check

  desktop:
    name: macOS app
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make -C apps/desktop check
      - name: Generated bindings are current
        run: make -C apps/desktop bindings-check

  android:
    name: Android app
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install GTK and WebKitGTK headers
        # Host tests compile Wails' Linux webview, which links against them.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - run: npm ci
      - run: make -C apps/mobile check
      - name: Generated strings are current
        run: |
          make -C apps/mobile strings
          if [ -n "$(git status --porcelain --untracked-files=all -- apps/mobile/build/android/app/src/main/res)" ]; then
            git status --short --untracked-files=all -- apps/mobile/build/android/app/src/main/res
            git diff -- apps/mobile/build/android/app/src/main/res
            echo "::error::Generated strings are stale; run make -C apps/mobile strings and commit the result"
            exit 1
          fi
